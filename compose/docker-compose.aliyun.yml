services:
  backend-init:
    image: ${BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/lens-rhyme/lens-rhyme-backend:latest}
    volumes:
      - backend_data:/app/data
      - backend_outputs:/app/outputs
    environment:
      DATABASE_URL: postgresql://lens_rhyme:lens_rhyme@postgres:5432/lens_rhyme
      BACKEND_DATA_PATH: /app/data
      BACKEND_OUTPUTS_PATH: /app/outputs
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
      DEPLOYMENT_INIT_CREATE_ADMIN: ${DEPLOYMENT_INIT_CREATE_ADMIN:-true}
      DEPLOYMENT_INIT_TEST_DATA: ${DEPLOYMENT_INIT_TEST_DATA:-false}
      TEST_USER_USERNAME: ${TEST_USER_USERNAME:-test_user}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-}
      DEPLOYMENT_INIT_PLATFORM_CONFIG_JSON: ${DEPLOYMENT_INIT_PLATFORM_CONFIG_JSON:-}
      DEPLOYMENT_INIT_PLATFORM_CONFIG_FORCE: ${DEPLOYMENT_INIT_PLATFORM_CONFIG_FORCE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - scripts.deployment_init
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/lens-rhyme/lens-rhyme-backend:latest}
    volumes:
      - backend_data:/app/data
      - backend_outputs:/app/outputs
    environment:
      SECRET_KEY: ${SECRET_KEY:-lens-rhyme-local-dev-key}
      DATABASE_URL: postgresql://lens_rhyme:lens_rhyme@postgres:5432/lens_rhyme
      BACKEND_DATA_PATH: /app/data
      BACKEND_OUTPUTS_PATH: /app/outputs
      MEMORY_SEMANTIC_SEARCH_ENABLED: "true"
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
      CODEX_AUTH_SECRET_MASTER_KEY: ${CODEX_AUTH_SECRET_MASTER_KEY:-}
      CHAT_CODEX_APPROVAL_MODE: deny_all
      CHAT_CODEX_RUNTIME: sdk
      CHAT_CODEX_RUNNER_MODE: remote_required
      CHAT_CODEX_AUTH_PROFILE_ADMIN_ENABLED: "true"
      CHAT_CODEX_PLATFORM_API_KEY_AUTH_ENABLED: "true"
      CHAT_CODEX_USE_SELECTED_MODEL: "false"
      CHAT_CODEX_RUNNER_MANAGER_URL: http://codex-runner-manager:8080
      CODEX_RUNNER_MANAGER_TOKEN: ${CODEX_RUNNER_MANAGER_TOKEN:-lens-rhyme-runner-local-token}
      CHAT_RUNNER_GRANT_SECRET: ${CHAT_RUNNER_GRANT_SECRET:-lens-rhyme-runner-local-grant}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_ACCESS_KEY_SECRET: ${OBJECT_STORAGE_ACCESS_KEY_SECRET:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-}
      OBJECT_STORAGE_CDN_DOMAIN: ${OBJECT_STORAGE_CDN_DOMAIN:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_ADDRESSING_STYLE: ${OBJECT_STORAGE_ADDRESSING_STYLE:-}
      OBJECT_STORAGE_CONNECT_TIMEOUT: ${OBJECT_STORAGE_CONNECT_TIMEOUT:-}
      OBJECT_STORAGE_READ_TIMEOUT: ${OBJECT_STORAGE_READ_TIMEOUT:-}
      OBJECT_STORAGE_MOCK_UPLOAD: ${OBJECT_STORAGE_MOCK_UPLOAD:-false}
      RESOURCEFS_BUCKET: ${RESOURCEFS_BUCKET:-resources}
      RESOURCEFS_CDN_BASE_URL: ${RESOURCEFS_CDN_BASE_URL:-}
      RESOURCEFS_CDN_SIGNING_SECRET: ${RESOURCEFS_CDN_SIGNING_SECRET:-}
      CONTENT_SITE_URL: ${CONTENT_SITE_URL:-https://lensrhyme.com}
      CONTENT_FRONTEND_REVALIDATION_URLS: ${CONTENT_FRONTEND_REVALIDATION_URLS:-http://content-frontend:3002/internal/content/revalidate}
      CONTENT_REVALIDATION_SECRET: ${CONTENT_REVALIDATION_SECRET:-}
      CONTENT_CDN_PURGE_ENDPOINT: ${CONTENT_CDN_PURGE_ENDPOINT:-}
      CONTENT_CDN_PURGE_TOKEN: ${CONTENT_CDN_PURGE_TOKEN:-}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDEXNOW_KEY_LOCATION: ${INDEXNOW_KEY_LOCATION:-https://lensrhyme.com/indexnow-key.txt}
    depends_on:
      backend-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      codex-runner-manager:
        condition: service_healthy
    command: ["python", "-m", "scripts.server", "start", "--host", "0.0.0.0", "--port", "8000"]
    restart: always

  codex-runner-manager:
    image: ${CODEX_RUNNER_IMAGE:-registry.cn-hangzhou.aliyuncs.com/lens-rhyme/lens-rhyme-codex-runner:latest}
    volumes:
      - codex_runner_data:/app/data
      - backend_outputs:/app/outputs
    environment:
      SECRET_KEY: ${SECRET_KEY:-lens-rhyme-local-dev-key}
      DATABASE_URL: postgresql://lens_rhyme:lens_rhyme@postgres:5432/lens_rhyme
      CODEX_AUTH_SECRET_MASTER_KEY: ${CODEX_AUTH_SECRET_MASTER_KEY:-}
      CHAT_CODEX_RUNTIME: sdk
      CHAT_CODEX_APPROVAL_MODE: deny_all
      CHAT_CODEX_AUTH_PROFILE_ADMIN_ENABLED: "true"
      CHAT_CODEX_PLATFORM_API_KEY_AUTH_ENABLED: "true"
      CHAT_CODEX_USE_SELECTED_MODEL: "false"
      CHAT_CODEX_ALLOW_WEB_ACCESS: "false"
      CODEX_RUNNER_MANAGER_TOKEN: ${CODEX_RUNNER_MANAGER_TOKEN:-lens-rhyme-runner-local-token}
      CHAT_RUNNER_GRANT_SECRET: ${CHAT_RUNNER_GRANT_SECRET:-lens-rhyme-runner-local-grant}
      CHAT_RUNNER_GRANTS_REQUIRED: "true"
      CHAT_RUNNER_DURABLE_CONTROL_ENABLED: "true"
      CHAT_RUNNER_DURABLE_CONTROL_REQUIRED: "true"
      CODEX_RUNNER_WORKDIR_ROOT: /app/data/workdirs
      CODEX_RUNNER_TURN_TIMEOUT_SECONDS: "600"
      CODEX_RUNNER_OUTPUT_CHUNK_BYTES: "16384"
      CODEX_RUNNER_OUTPUT_TURN_BYTES: "16777216"
      RUNNER_SUBSTRATE: isolated-container
    command: ["python", "-m", "scripts.runner_manager", "--host", "0.0.0.0", "--port", "8080"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: always

  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: lens_rhyme
      POSTGRES_USER: lens_rhyme
      POSTGRES_PASSWORD: lens_rhyme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens_rhyme -d lens_rhyme"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  frontend:
    image: ${FRONTEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/lens-rhyme/lens-rhyme-frontend:latest}
    restart: always

  admin-frontend:
    image: ${ADMIN_FRONTEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/lens-rhyme/lens-rhyme-admin-frontend:latest}
    restart: always

  docs-site:
    image: ${DOCS_SITE_IMAGE:-registry.cn-hangzhou.aliyuncs.com/lens-rhyme/lens-rhyme-docs-site:latest}
    restart: always

  content-frontend:
    image: ${CONTENT_FRONTEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/lens-rhyme/lens-rhyme-content-frontend:latest}
    environment:
      NEXT_PUBLIC_SITE_URL: ${CONTENT_SITE_URL:-https://lensrhyme.com}
      NEXT_PUBLIC_PRODUCT_URL: ${CONTENT_PRODUCT_URL:-https://lensrhyme.com/login}
      CONTENT_SOURCE: ${CONTENT_SOURCE:-api}
      CONTENT_API_BASE_URL: ${CONTENT_API_BASE_URL:-http://backend:8000/api/v1/public/content}
      CONTENT_API_REQUIRED: ${CONTENT_API_REQUIRED:-1}
      CONTENT_API_REVALIDATE_SECONDS: ${CONTENT_API_REVALIDATE_SECONDS:-300}
      CONTENT_REVALIDATION_SECRET: ${CONTENT_REVALIDATION_SECRET:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      CONTENT_MEDIA_HOSTS: ${CONTENT_MEDIA_HOSTS:-lensrhyme.tos-cn-hongkong.volces.com,cdn.lens-rhyme.tensorbytes.com}
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "5410:80"
      - "5041:8080"
    depends_on:
      - backend
      - frontend
      - admin-frontend
      - docs-site
      - content-frontend
    restart: always

volumes:
  backend_data:
  backend_outputs:
  codex_runner_data:
  postgres_data:

configs:
  nginx_config:
    content: |
      server {
          listen       80;
          server_name  localhost;

          resolver 127.0.0.11 valid=30s ipv6=off;

          client_max_body_size 2g;

          gzip on;
          gzip_vary on;
          gzip_min_length 1024;
          gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

          location = /internal/content/revalidate {
              limit_except POST { deny all; }
              set $$upstream http://content-frontend:3002;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location ~ ^/(?:blog|press|guides|workflows|templates|compare|use-cases)(?:/|$$) {
              set $$upstream http://content-frontend:3002;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location ~ ^/(?:search|feed\.xml|sitemap\.xml|sitemaps/.*|robots\.txt|manifest\.webmanifest|indexnow-key\.txt)$$ {
              set $$upstream http://content-frontend:3002;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location ^~ /content-assets/ {
              set $$upstream http://content-frontend:3002;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location ^~ /editorial/ {
              set $$upstream http://content-frontend:3002;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location ~* _next/static/ {
              set $$upstream http://frontend:3000;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$$ {
              set $$upstream http://frontend:3000;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location ^~ /admin {
              return 404;
          }

          location = /docs {
              return 301 $$scheme://$$http_host/docs/;
          }

          location ^~ /docs/ {
              set $$upstream http://docs-site:80;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location / {
              set $$upstream http://frontend:3000;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              add_header Cache-Control "no-cache, no-store, must-revalidate";
          }

          location ~ ^/api/v(?:1|3)/ {
              set $$upstream http://backend:8000;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              proxy_read_timeout 600;
              proxy_connect_timeout 600;
              proxy_send_timeout 600;

              proxy_request_buffering off;
              proxy_buffering off;
          }

          location /outputs/ {
              set $$upstream http://backend:8000;
              proxy_pass $$upstream;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }

      server {
          listen       8080;
          server_name  localhost;

          resolver 127.0.0.11 valid=30s ipv6=off;

          client_max_body_size 2g;

          gzip on;
          gzip_vary on;
          gzip_min_length 1024;
          gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

          location ~ ^/api/v(?:1|3)/ {
              set $$upstream http://backend:8000;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              proxy_read_timeout 600;
              proxy_connect_timeout 600;
              proxy_send_timeout 600;

              proxy_request_buffering off;
              proxy_buffering off;
          }

          location /outputs/ {
              set $$upstream http://backend:8000;
              proxy_pass $$upstream;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location ~* _next/static/ {
              set $$upstream http://admin-frontend:3001;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$$ {
              set $$upstream http://admin-frontend:3001;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              expires 1y;
              add_header Cache-Control "public, immutable";
          }

          location / {
              set $$upstream http://admin-frontend:3001;
              proxy_pass $$upstream;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              add_header Cache-Control "no-cache, no-store, must-revalidate";
          }
      }
